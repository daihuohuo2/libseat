name: Booking regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  booking-flows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - name: Isolated booking, renewal, release, browser and cache tests
        run: node --test tests/*.test.js
